<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina - Interactive 3D Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Outfit:wght@300;400;600&display=swap');

        :root {
            --font-sans: 'Plus Jakarta Sans', sans-serif;
            --font-display: 'Outfit', sans-serif;
            --bg-deep: #050505;
        }

        body {
            margin: 0;
            overflow-x: hidden;
            background-color: var(--bg-deep);
            font-family: var(--font-sans);
            color: #ffffff;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        @keyframes fade-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade-up {
            animation: fade-up 1s cubic-bezier(0.19, 1, 0.22, 1) forwards;
        }

        .delay-100 { animation-delay: 0.1s; }
        .delay-200 { animation-delay: 0.2s; }
        .delay-300 { animation-delay: 0.3s; }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }

        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.03;
            z-index: 5;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3%3Ffilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }
    </style>
</head>
<body>
    <div class="relative min-h-screen w-full flex flex-col items-center justify-center overflow-hidden bg-[#050505]">
        <!-- Noise & Grain Layer -->
        <div class="noise-overlay"></div>

        <!-- Interactive Background -->
        <div id="canvas-container" class="absolute inset-0 z-0">
            <canvas id="tubes-canvas" class="w-full h-full"></canvas>
        </div>

        <!-- Navigation -->
        <nav class="fixed top-0 left-0 w-full p-8 flex justify-between items-center z-50 pointer-events-none">
            <div class="pointer-events-auto">
                <a href="#" id="brand-logo" class="text-xl font-semibold tracking-widest uppercase font-display hover:opacity-70 transition-opacity">
                    Lumina
                </a>
            </div>
            <div class="pointer-events-auto flex items-center gap-8">
                <a href="#" id="nav-studio" class="text-xs uppercase tracking-[0.2em] font-medium opacity-60 hover:opacity-100 transition-all">Studio</a>
                <a href="#" id="nav-projects" class="text-xs uppercase tracking-[0.2em] font-medium opacity-60 hover:opacity-100 transition-all">Work</a>
                <div class="h-[1px] w-8 bg-white/20"></div>
                <a href="#" id="nav-contact" class="px-5 py-2 glass-panel rounded-full text-xs uppercase tracking-[0.2em] font-medium hover:bg-white/10 transition-all">Contact</a>
            </div>
        </nav>

        <!-- Main Content Hero Section -->
        <main class="relative z-20 flex flex-col items-center text-center px-6 max-w-4xl pointer-events-none">
            <div class="animate-fade-up">
                <span class="text-[10px] md:text-xs uppercase tracking-[0.5em] text-white/40 mb-6 block font-medium">Experimental Interaction</span>
                <h1 class="text-7xl md:text-9xl font-display font-light tracking-tighter mb-8 leading-[0.9] text-white">
                    Sculpting<br/>
                    <span class="italic font-normal opacity-90">Digital Light</span>
                </h1>
                <p class="text-lg md:text-xl text-white/60 font-light max-w-xl mx-auto leading-relaxed mb-12 animate-fade-up delay-100">
                    A sensory landscape where form follows your focus. Experience the intersection of motion and neon geometry.
                </p>
                
                <div class="flex flex-col md:flex-row items-center justify-center gap-6 animate-fade-up delay-200 pointer-events-auto">
                    <button id="cta-begin" class="group relative px-10 py-4 overflow-hidden rounded-full bg-white text-black text-sm font-semibold uppercase tracking-widest transition-transform hover:scale-105 active:scale-95">
                        <span class="relative z-10">Start Journey</span>
                    </button>
                    <button id="cta-view-reel" class="flex items-center gap-3 px-10 py-4 glass-panel rounded-full text-sm font-semibold uppercase tracking-widest hover:bg-white/10 transition-all">
                        <iconify-icon icon="lucide:play-circle" class="text-lg"></iconify-icon>
                        View Reel
                    </button>
                </div>
            </div>
        </main>

        <!-- Interaction Hint Footer -->
        <footer class="fixed bottom-12 left-0 w-full flex flex-col items-center z-40 pointer-events-none">
            <div class="animate-bounce mb-3">
                <iconify-icon icon="lucide:mouse-pointer-2" class="text-white/30 text-xl"></iconify-icon>
            </div>
            <div class="flex flex-col items-center gap-1 opacity-40">
                <p class="text-[10px] uppercase tracking-[0.3em] font-medium">Move to interact</p>
                <p class="text-[8px] uppercase tracking-[0.3em] font-light">Click to randomize</p>
            </div>
        </footer>

        <!-- Social Floating Sidebar -->
        <div class="fixed right-8 bottom-12 flex flex-col gap-6 z-40 pointer-events-auto">
            <a href="#" id="social-twitter" class="text-white/30 hover:text-white transition-colors">
                <iconify-icon icon="simple-icons:x" class="text-lg"></iconify-icon>
            </a>
            <a href="#" id="social-instagram" class="text-white/30 hover:text-white transition-colors">
                <iconify-icon icon="simple-icons:instagram" class="text-lg"></iconify-icon>
            </a>
            <a href="#" id="social-linkedin" class="text-white/30 hover:text-white transition-colors">
                <iconify-icon icon="simple-icons:linkedin" class="text-lg"></iconify-icon>
            </a>
        </div>
    </div>

    <!-- Scripts for 3D Background -->
    <script type="module">
        const randomColor = () => "#" + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');

        async function initBackground() {
            const canvas = document.getElementById('tubes-canvas');
            if (!canvas) return;

            try {
                // Use the library from CDN as requested in the reference implementation
                const module = await import('https://cdn.jsdelivr.net/npm/threejs-components@0.0.19/build/cursors/tubes1.min.js');
                const TubesCursor = module.default;

                const app = TubesCursor(canvas, {
                    tubes: {
                        colors: ["#f967fb", "#53bc28", "#6958d5"],
                        lights: {
                            intensity: 220,
                            colors: ["#83f36e", "#fe8a2e", "#ff008a", "#60aed5"]
                        }
                    }
                });

                // Handle Color Randomization on click
                window.addEventListener('click', (e) => {
                    // Don't randomize if clicking UI elements (buttons, links)
                    if (e.target.closest('button') || e.target.closest('a')) return;
                    
                    const colors = [randomColor(), randomColor(), randomColor()];
                    const lightColors = [randomColor(), randomColor(), randomColor(), randomColor()];
                    
                    app.tubes.setColors(colors);
                    app.tubes.setLightsColors(lightColors);
                });

                // Responsive Resize Helper
                window.addEventListener('resize', () => {
                    // The library usually handles this internally, but ensure container fit
                    canvas.style.width = '100%';
                    canvas.style.height = '100%';
                });

            } catch (err) {
                console.error("Background init failed:", err);
            }
        }

        initBackground();
    </script>

</body>
</html>
